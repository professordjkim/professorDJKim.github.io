<!DOCTYPE HTML>
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Photography - Your Name</title>
  <meta name="author" content="Your Name">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Photography portfolio of Your Name.">
  <meta name="robots" content="index, follow">

  <meta property="og:title" content="Photography - Your Name">
  <meta property="og:description" content="Photography portfolio of Your Name.">
  <meta property="og:image" content="https://yourwebsite.com/figures/me.jpg">
  <meta property="og:url" content="https://yourwebsite.com/photography.html">
  <meta property="og:type" content="profile">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Photography - Your Name">
  <meta name="twitter:description" content="Photography portfolio of Your Name.">
  <meta name="twitter:image" content="https://yourwebsite.com/figures/me.jpg">

  <link rel="stylesheet" type="text/css" href="stylesheet.css">
  <link rel="stylesheet" type="text/css" href="shared-styles.css">
  <link rel="icon" type="image/png" href="figures/logo.png">
  <style>
    body {
      font-display: swap;
    }

    .photography-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 20px;
      text-align: left;
    }

    [data-theme="dark"] .page-title { color: var(--text-color); }

    .gallery-intro {
      text-align: center;
      max-width: 600px;
      margin: 0 auto 40px;
      line-height: 1.8;
      font-size: 16px;
      color: #666;
      font-style: italic;
    }

    /* Masonry Grid */
    .photo-grid {
      column-count: 3;
      column-gap: 20px;
      margin-bottom: 60px;
    }

    .photo-item {
      break-inside: avoid;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      cursor: pointer;
      opacity: 0;
      transform: translateY(30px);
    }

    .photo-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .photo-item.hidden {
      display: none;
    }

    .photo-item:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    .photo-item.visible:hover {
      transform: translateY(-8px);
    }

    .photo-item img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      filter: brightness(0.95) contrast(1.05);
    }

    .photo-item:hover img {
      transform: scale(1.05);
      filter: brightness(1) contrast(1.1);
    }

    .photo-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.8));
      color: white;
      padding: 40px 15px 15px;
      opacity: 0;
      transition: all 0.4s ease;
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 0.5px;
    }

    .photo-item:hover .photo-caption {
      opacity: 1;
    }

    .photo-title {
      font-weight: 500;
      margin-bottom: 4px;
      font-size: 16px;
    }

    .photo-meta {
      font-size: 12px;
      opacity: 0.9;
      color: #ddd;
    }

    /* Responsive Masonry */
    @media screen and (max-width: 1024px) {
      .photography-container {
        padding: 30px 15px;
      }

      .photo-grid {
        column-count: 2;
        column-gap: 15px;
      }

      .photo-item {
        margin-bottom: 15px;
      }
    }

    @media screen and (max-width: 768px) {
      .page-title {
        font-size: 32px;
      }

      .gallery-intro {
        font-size: 16px;
        margin-bottom: 30px;
      }

      .photo-item {
        border-radius: 10px;
      }
    }

    @media screen and (max-width: 600px) {
      .photography-container {
        padding: 20px 10px;
      }

      .page-title {
        font-size: 28px;
      }

      .photo-grid {
        column-count: 1;
        column-gap: 0;
      }

      .photo-item {
        margin-bottom: 15px;
      }

      .photo-caption {
        opacity: 1;
        padding: 30px 12px 12px;
      }

      .photo-title {
        font-size: 14px;
      }

      .photo-meta {
        font-size: 11px;
      }
    }

    /* Lightbox Styles */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.95);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .lightbox.active {
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 35px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.2s;
      z-index: 1001;
    }

    .lightbox-close:hover {
      color: var(--primary-color);
    }

    .lightbox-content {
      max-width: 90%;
      max-height: 85%;
      border-radius: 8px;
      box-shadow: 0 10px 50px rgba(0,0,0,0.5);
    }

    .lightbox-caption {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      text-align: center;
      font-size: 16px;
    }

    .lightbox-caption .photo-title {
      font-size: 18px;
      margin-bottom: 5px;
    }

    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 50px;
      cursor: pointer;
      padding: 20px;
      transition: color 0.2s;
      user-select: none;
    }

    .lightbox-nav:hover {
      color: var(--primary-color);
    }

    .lightbox-prev {
      left: 20px;
    }

    .lightbox-next {
      right: 20px;
    }

    /* Dark mode styles */
    [data-theme="dark"] .gallery-intro {
      color: var(--text-color, #b8b8b8);
    }

    [data-theme="dark"] .photo-item {
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    [data-theme="dark"] .photo-caption {
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
    }

    [data-theme="dark"] .photo-title {
      color: #fff;
    }

    [data-theme="dark"] .photo-meta {
      color: #ccc;
    }
  </style>
</head>

<body data-footer-width="wide">
  <div id="site-nav"></div>

  <!-- Photography Content -->
  <main id="main-content" class="photography-container">
    <h1 class="page-title">Photography</h1>

    <div class="gallery-intro">
      <p>A short caption describing what your photography is about.</p>
    </div>

    <!-- Masonry Photo Grid -->
    <div class="photo-grid" id="photo-grid">
      <div class="photo-item" data-year="YYYY" data-location="Location">
        <img src="photos/sample-photo.jpg" alt="Sample Photo" loading="lazy">
        <div class="photo-caption">
          <div class="photo-title">Sample Photo Title</div>
          <div class="photo-meta">Location • Month YYYY</div>
        </div>
      </div>
    </div>
  </main>

  <!-- Enhanced Lightbox -->
  <div id="lightbox" class="lightbox">
    <span class="lightbox-close" id="close-lightbox">&times;</span>
    <span class="lightbox-nav lightbox-prev" id="lightbox-prev">&#10094;</span>
    <span class="lightbox-nav lightbox-next" id="lightbox-next">&#10095;</span>
    <img class="lightbox-content" id="lightbox-img" alt="">
    <div class="lightbox-caption">
      <div class="photo-title" id="lightbox-title"></div>
      <div class="photo-meta" id="lightbox-meta"></div>
    </div>
  </div>

  <div id="site-footer"></div>

  <!-- Load JavaScript files -->
  <script src="site-shell.js"></script>
  <script src="utils.js"></script>
  <script>
    // Photo data for lightbox navigation
    let visiblePhotos = [];
    let currentPhotoIndex = 0;

    document.addEventListener('DOMContentLoaded', function() {
      initializeDarkMode();
      initializeBackToTop();
      initializeFadeIn();
      initializeLightbox();
    });

    /**
     * Initialize fade-in animations on scroll
     */
    function initializeFadeIn() {
      const photoItems = document.querySelectorAll('.photo-item');

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry, index) => {
          if (entry.isIntersecting) {
            // Stagger the animations
            setTimeout(() => {
              entry.target.classList.add('visible');
            }, index * 100);
            observer.unobserve(entry.target);
          }
        });
      }, {
        threshold: 0.1,
        rootMargin: '0px 0px -50px 0px'
      });

      photoItems.forEach(item => {
        observer.observe(item);
      });

      // Initialize visible photos array
      updateVisiblePhotos();
    }

    /**
     * Update the array of visible photos for lightbox navigation
     */
    function updateVisiblePhotos() {
      visiblePhotos = Array.from(document.querySelectorAll('.photo-item:not(.hidden)'));
    }

    /**
     * Enhanced lightbox with navigation
     */
    function initializeLightbox() {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      const lightboxTitle = document.getElementById('lightbox-title');
      const lightboxMeta = document.getElementById('lightbox-meta');
      const closeBtn = document.getElementById('close-lightbox');
      const prevBtn = document.getElementById('lightbox-prev');
      const nextBtn = document.getElementById('lightbox-next');

      if (!lightbox) return;

      // Click on photo to open lightbox
      document.querySelectorAll('.photo-item').forEach((item, index) => {
        item.addEventListener('click', function() {
          updateVisiblePhotos();
          currentPhotoIndex = visiblePhotos.indexOf(this);
          openLightbox();
        });
      });

      function openLightbox() {
        const item = visiblePhotos[currentPhotoIndex];
        if (!item) return;

        const img = item.querySelector('img');
        const title = item.querySelector('.photo-title');
        const meta = item.querySelector('.photo-meta');

        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
        lightboxTitle.textContent = title ? title.textContent : '';
        lightboxMeta.textContent = meta ? meta.textContent : '';

        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
      }

      function showPrev() {
        currentPhotoIndex = (currentPhotoIndex - 1 + visiblePhotos.length) % visiblePhotos.length;
        openLightbox();
      }

      function showNext() {
        currentPhotoIndex = (currentPhotoIndex + 1) % visiblePhotos.length;
        openLightbox();
      }

      closeBtn.addEventListener('click', closeLightbox);
      prevBtn.addEventListener('click', showPrev);
      nextBtn.addEventListener('click', showNext);

      lightbox.addEventListener('click', function(e) {
        if (e.target === lightbox) {
          closeLightbox();
        }
      });

      document.addEventListener('keydown', function(e) {
        if (!lightbox.classList.contains('active')) return;

        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') showPrev();
        if (e.key === 'ArrowRight') showNext();
      });
    }
  </script>
</body>

</html>
